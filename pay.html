<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="CSS/styles.css">
        <script src="JavaScript/javascript.js" defer></script>
        <title>BOOK WORLD!</title>
    </head>

    <body>
        <div id="navigation"></div>

        <main id="mainPay">
            <h2> Payment Options:</h2>
            <h3>Debit/Credit Card</h3>

            <form id="payForm">
                <div class="formItem">
                <label for="cardNumber">Card Number:</label>
                <input id="cardNumber" name="cardNumber" required>
                </div>

                <div class="formItem">
                <label>Expiration Date:</label>
                <select id="expMonth" name="expMonth" required>
                    <option value="" disabled selected>Month</option>
                </select>
                <select id="expYear" name="expYear" required>
                    <option value="" disabled selected>Year</option>
                </select>
                </div>

                <div class="formItem">
                <label for="CVV">Security Code</label>
                <input id="cvv" name="CVV" required>
                <p>(3-4 digit code - usually on the back of your card)</p>
                </div>
                <p id="validation"></p>
                <button id="continue">Continue</button>
            </form>
        </main>
    </body>
</html>
